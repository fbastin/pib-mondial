[pytest]
# Tests dans tests/, lancés depuis la racine : le paquet pib s'importe depuis là
testpaths = tests
pythonpath = .
markers =
    donnees: contrôles sur les fichiers réellement produits par le pipeline
             (sautés tant que `python produire_rapports.py` n'a pas tourné)
filterwarnings =
    error::pytest.PytestUnknownMarkWarning
