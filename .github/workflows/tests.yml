name: Tests des invariants

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Sous-ensemble de requirements.txt : jupyter et nbconvert servent aux notebooks,
      # dont l'exécution n'est pas testée ici. Les installer allongerait le run sans
      # rien vérifier de plus.
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests openpyxl matplotlib seaborn plotly pytest

      # Les tests marqués `donnees` portent sur les CSV produits par le pipeline, qui
      # ne sont pas versionnés. Ils se sauteraient d'eux-mêmes ; on les écarte
      # explicitement pour que le compte de tests exécutés reste lisible.
      - name: Tests unitaires (sans réseau ni données produites)
        run: pytest -m "not donnees" -v
